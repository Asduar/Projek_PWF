  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;500;700&display=swap');
    body {
      background-color: #0d0d18;
      color: #f8f9fa;
      font-family: 'Poppins', sans-serif;
      padding-bottom: 40px;
    }

    h1 {
      text-align: center;
      margin: 40px 0 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    fieldset {
      border: 2px solid #6c63ff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 40px;
      transition: all 0.3s ease;
    }

    legend {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 0 14px;
      border-radius: 8px;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .photo-upload {
      background-color: rgba(255, 255, 255, 0.08);
      border: 2px dashed #6c63ff;
      border-radius: 10px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .photo-upload input[type="file"] {
      display: none;
    }

    .photo-upload i {
      font-size: 2rem;
    }

    .photo-upload span {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #bbb;
    }

    /* === ALBUM COLORS === */
    fieldset.richman {
      border-color: #c6a4ff;
      background-color: rgba(198, 164, 255, 0.08);
    }
    fieldset.richman legend { color: #e0c3ff; }
    fieldset.richman .photo-upload { border-color: #c6a4ff; }

    fieldset.dirtywork {
      border-color: #b87333;
      background-color: rgba(184, 115, 51, 0.08);
    }
    fieldset.dirtywork legend { color: #d79b63; }
    fieldset.dirtywork .photo-upload { border-color: #b87333; }

    fieldset.whiplash {
      border-color: #00e0ff;
      background-color: rgba(0, 224, 255, 0.08);
    }
    fieldset.whiplash legend { color: #00ffff; }
    fieldset.whiplash .photo-upload { border-color: #00e0ff; }

    fieldset.drama {
      border-color: #b30000;
      background-color: rgba(179, 0, 0, 0.12);
      box-shadow: 0 0 15px rgba(255, 0, 0, 0.15);
    }
    fieldset.drama legend { color: #ff4d4d; }
    fieldset.drama .photo-upload {
      border-color: #ff4d4d;
      background-color: rgba(0, 0, 0, 0.4);
    }
    fieldset.drama .photo-upload:hover {
      background-color: rgba(255, 0, 0, 0.15);
    }

    fieldset.blackmamba {
      border-color: #5a189a;
      background-color: rgba(60, 0, 90, 0.15);
      box-shadow: 0 0 12px rgba(100, 0, 150, 0.3);
    }
    fieldset.blackmamba legend { color: #d7aefb; }
    fieldset.blackmamba .photo-upload { border-color: #7b2cbf; }

    .sidebar-custom {
      background-color: #1b1b2f;
      color: white;
    }
  </style>
