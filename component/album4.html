<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiplash - The 5th Mini Album | MYKROS</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        /* CSS yang konsisten dengan desain sebelumnya */
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Roboto, sans-serif; }
        .navbar-brand { font-size: 20px; }

        /* Container Utama Album - Gradient Abu-abu Gelap ke Hitam */
        .album-header-container {
            background: linear-gradient(0deg, #000 0%, #333333 100%); /* Abu-abu gelap untuk mencocokkan sampul */
            padding-top: 50px; 
            padding-bottom: 80px; 
        }

        /* Detail Album Header Style */
        .album-header { display: flex; align-items: flex-end; padding: 0 50px; gap: 25px; }
        .album-cover { width: 230px; height: 230px; box-shadow: 0 4px 60px rgba(0, 0, 0, 0.5); border-radius: 5px; }
        .album-info-detail h5 { font-size: 14px; font-weight: 500; color: #ccc; margin-bottom: 5px; text-transform: uppercase; }
        .album-info-detail h1 { font-size: 80px; font-weight: 900; line-height: 1; }
        .album-meta p { font-size: 14px; color: #ccc; margin: 0; }
        
        /* Tracklist / Daftar Lagu Style */
        .tracklist-container { padding: 50px 50px 80px; background-color: #000; }
        .tracklist-table { width: 100%; border-collapse: collapse; }
        .tracklist-table th { color: #b3b3b3; font-size: 12px; padding: 10px 0; text-align: left; border-bottom: 1px solid #282828; }
        .tracklist-table th:first-child { width: 40px; text-align: right; padding-right: 15px; }
        .tracklist-table td { padding: 10px 0; border-bottom: 1px solid #1a1a1a; font-size: 15px; }
        .track-number, .track-duration { color: #b3b3b3; text-align: right; }
        .track-title strong { display: block; font-weight: 600; }
        .track-title span { color: #b3b3b3; font-size: 13px; }
        .track-duration { width: 80px; }

        /* Responsive Media Queries */
        @media (max-width: 768px) {
            .album-header { flex-direction: column; align-items: center; text-align: center; padding: 0 20px; gap: 15px; }
            .album-cover { width: 150px; height: 150px; }
            .album-info-detail h1 { font-size: 48px; }
            .tracklist-container { padding: 40px 20px 80px; }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-dark bg-black sticky-top shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold ms-3" href="diskografi.html">
                <i class="bi bi-arrow-left me-2"></i> KEMBALI
            </a>
            <span class="navbar-brand fw-bold mx-auto">MYKROS</span>
        </div>
    </nav>

    <div class="album-header-container">
        <header class="album-header">
            <img src="../asset/whiplash.jpg" alt="Whiplash Cover" class="album-cover">
            
            <div class="album-info-detail">
                <h5>EP</h5>
                <h1>Whiplash - The 5th Mini Album</h1>
                <div class="album-meta">
                    <p>aespa • 2024 • 6 songs, 18 min 6 sec</p>
                </div>
            </div>
        </header>
    </div>

    <main class="tracklist-container">
        <table class="tracklist-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>JUDUL</th>
                    <th style="text-align: right;"><i class="bi bi-clock"></i></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="track-number">1</td>
                    <td class="track-title"><strong>Whiplash</strong><span>aespa</span></td>
                    <td class="track-duration">3:03</td>
                </tr>
                <tr>
                    <td class="track-number">2</td>
                    <td class="track-title"><strong>Kill It</strong><span>aespa</span></td>
                    <td class="track-duration">3:19</td>
                </tr>
                <tr>
                    <td class="track-number">3</td>
                    <td class="track-title"><strong>Flights Not Feelings</strong><span>aespa</span></td>
                    <td class="track-duration">2:58</td>
                </tr>
                <tr>
                    <td class="track-number">4</td>
                    <td class="track-title"><strong>Gravity</strong><span>aespa</span></td>
                    <td class="track-duration">3:01</td>
                </tr>
                <tr>
                    <td class="track-number">5</td>
                    <td class="track-title"><strong>Bad Dream</strong><span>aespa</span></td>
                    <td class="track-duration">2:45</td>
                </tr>
                <tr>
                    <td class="track-number">6</td>
                    <td class="track-title"><strong>Starfall</strong><span>aespa</span></td>
                    <td class="track-duration">2:50</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
